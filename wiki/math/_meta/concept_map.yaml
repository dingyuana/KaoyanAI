  幂级数:
    - 泰勒级数
    - 麦克劳林级数
    - 展开式
    - 收敛半径

  # 线性代数
  矩阵:
    - 系数矩阵
    - 增广矩阵
    - 方阵

  行列式:
    - n阶行列式
    - 行列式的计算

  向量:
