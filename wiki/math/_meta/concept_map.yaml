# concept_map.yaml - 数学考研标准概念词表

> 本文件定义标准概念与原文同义词的映射关系。  
> 用于 LLM 检索时的概念标准化。

# 标准概念 -> 同义词映射
# 格式：标准概念: [同义词列表]

映射:

  # 高等数学 - 函数与极限
  极限:
    - 函数的极限
    - 数列极限
    - 极限值
    - 趋近于
    - 无限接近

  函数极限:
    - 自变量趋近于某点
    - x→x₀
    - x→∞
    - 函数的极限定义

  数列极限:
    - 数列的极限
    - aₙ趋于
    - n→∞

  ε-δ定义:
    - epsilon-delta
    - epsilon delta
    - ε-δ语言
    - epsillon
    - 极限的严格定义

  无穷小:
    - 无穷小量
    - 趋于0
    - 无限接近于0
    - infitesimal

  无穷大:
    - 无穷大量
    - 趋于无穷
    - 无限增大
    - 无界

  # 导数与微分
  导数:
    - 微商
    - 导函数
    - 求导
    - 导数的定义

  偏导数:
    - 多元函数导数
    - 偏导

  全微分:
    - 全导数
    - 微分
    - 全微分的定义

  可导:
    - 可微分
    - 导数存在
    - 有导数

  # 积分
  不定积分:
    - 原函数
    - 积分
    - 求原函数
    - 不定积分的定义

  定积分:
    - 定积分的计算
    - 牛顿莱布尼茨公式
    - 积分上限

  多元积分:
    - 重积分
    - 二重积分
    - 三重积分
    - 曲线积分
    - 曲面积分

  # 微分方程
  微分方程:
    - 常微分方程
    - ODE
    - PDE

  一阶微分方程:
    - 可分离变量方程
    - 齐次方程
    - 一阶线性方程

  二阶微分方程:
    - 二阶常系数线性微分方程
    - 二阶常系数齐次/非齐次

  # 级数
  数项级数:
